input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "${MSSQL_CONNECTION_STRING}"
    jdbc_user => "${MSSQL_USER}"
    jdbc_password => "${MSSQL_PASSWORD}"
    lowercase_column_names => false
    schedule => "*/5 * * * * *"
    use_column_value => true
    tracking_column => "syncVersion"
    tracking_column_type => "numeric"
    clean_run => false
    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/data/klient_adresa_last_sync_version.yml"
    statement => "SELECT DISTINCT
      ka.klient_id AS klientId,
      ka.cnum AS cnum,
      k.rodne_cislo AS rodneCislo,
      k.ico AS ico,
      k.meno AS name,
      k.priezvisko AS surname,
      COALESCE((
        SELECT
          a.ulica,
          a.cislo,
          a.psc,
          a.mesto
        FROM [MAC].[dbo].[KLIENT_ADRESA] a
        WHERE a.klient_id = ka.klient_id
          AND a.cnum = ka.cnum
        FOR JSON PATH
      ), '[]') AS adresy,
      ct.SYS_CHANGE_OPERATION AS changeOperation,
      ct.SYS_CHANGE_VERSION AS syncVersion
    FROM CHANGETABLE(CHANGES [MAC].[dbo].[KLIENT_ADRESA], :sql_last_value) ct
    INNER JOIN [MAC].[dbo].[KLIENT_ADRESA] ka
      ON ka.klient_adresa_id = ct.klient_adresa_id
    INNER JOIN [MAC].[dbo].[KLIENT] k
      ON k.klient_id = ka.klient_id
     AND k.cnum = ka.cnum"
  }
}

filter {
  json {
    source => "adresy"
    target => "adresy"
  }

  if [changeOperation] == "D" {
    mutate {
      add_field => { "[@metadata][opensearch_action]" => "delete" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][opensearch_action]" => "index" }
    }
  }

  mutate {
    remove_field => ["@version", "changeOperation"]
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "${OPENSEARCH_INDEX}"
    document_id => "%{klientId}"
    action => "%{[@metadata][opensearch_action]}"
    ssl => false
  }
  stdout { codec => rubydebug }
}
