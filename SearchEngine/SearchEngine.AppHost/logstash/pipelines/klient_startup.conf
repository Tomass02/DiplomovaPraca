input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "${MSSQL_CONNECTION_STRING}"
    jdbc_user => "${MSSQL_USER}"
    jdbc_password => "${MSSQL_PASSWORD}"
    # schedule => "*/30 * * * * *" # only on startup so no schedule
    statement => "SELECT
                    k.klient_id,
                    k.cnum,
                    k.rodne_cislo,
                    k.ico,
                    k.meno,
                    k.priezvisko,
                    COALESCE((
                      SELECT
                        a.ulica,
                        a.cislo,
                        a.psc,
                        a.mesto
                      FROM [MAC].[dbo].[KLIENT_ADRESA] a
                      WHERE a.klient_id = k.klient_id
                        AND a.cnum = k.cnum
                      FOR JSON PATH
                    ), '[]') AS klient_adresy
                  FROM [MAC].[dbo].[KLIENT] k"
  }
}

filter {
  json {
    source => "klient_adresy"
    target => "klient_adresy"
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "${OPENSEARCH_INDEX}"
    document_id => "{klient_id}"
    action => "update"
    doc_as_upsert => true
    ssl => false
  }
  stdout { codec => rubydebug }
}