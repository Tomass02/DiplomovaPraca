input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://sqlserver:1433;databaseName=master;encrypt=false;trustServerCertificate=true"
    jdbc_user => "${MSSQL_USER}"
    jdbc_password => "${MSSQL_PASSWORD}"
    # schedule => "*/30 * * * * *" # only on startup so no schedule
    statement => "SELECT TOP 100 * FROM dbo.YourTable"
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "mssql-data-%{+YYYY.MM.dd}"
    ssl => false
  }
  stdout { codec => rubydebug }
}